<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闽浙吾悦商圈动态监控</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e6e8ec;
    --text:#1a1d24; --text2:#5b6472; --text3:#9aa1ad;
    --brand:#3b5bfd; --brand-soft:#eef1ff;
    --open:#e5484d; --open-soft:#fdecec;
    --close:#8a9099; --close-soft:#f1f2f4;
    --change:#e8912d; --change-soft:#fdf3e6;
    --act:#3b82f6; --act-soft:#eaf2fe;
    --comp:#7c5bff; --comp-soft:#f1eeff;
    --ok:#16a34a;
    --radius:12px;
    --shadow:0 1px 2px rgba(20,24,40,.05), 0 6px 18px rgba(20,24,40,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
       background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--brand);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:900px;margin:0 auto;padding:18px 18px 50px}

  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:2px 0 14px}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#3b5bfd,#7c5bff);
        display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:19px;flex:none}
  .brand h1{font-size:18px;font-weight:700}
  .brand .sub{font-size:12px;color:var(--text3)}
  .meta{text-align:right;font-size:12px;color:var(--text3)}
  .meta b{color:var(--text2);font-weight:600}

  .switch-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:12px}
  .seg{display:flex;background:#e9ebef;border-radius:11px;padding:3px;gap:3px}
  .seg button{border:none;background:transparent;font-size:14px;font-weight:600;color:var(--text2);
              padding:8px 18px;border-radius:9px;cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap}
  .seg button.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(20,24,40,.14)}
  .seg .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

  .statstrip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 13px;font-size:12.5px;color:var(--text2)}
  .pill b{font-weight:700;font-size:14px}
  .pill .up{color:var(--open)}
  .pill .down{color:var(--ok)}

  .filters{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .filters .lbl{font-size:12px;color:var(--text3);font-weight:600;margin-right:2px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:3px 11px;font-size:12px;
        color:var(--text2);cursor:pointer;transition:.12s;font-family:inherit;white-space:nowrap}
  .chip.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}

  /* 分广场区块 */
  .mall-section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
                box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
  .mall-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
             padding:11px 15px;border-bottom:1px solid var(--line);background:#fafbfc}
  .mall-head .mname{font-weight:700;font-size:14.5px}
  .mall-head .mcity{font-size:11.5px;color:var(--text3);margin-left:7px}
  .mall-head .mcount{font-size:11.5px;color:var(--text2);font-weight:600;flex:none}
  .mall-body{padding:6px 15px 8px}

  .comp-line{font-size:12px;color:var(--text2);padding:7px 2px 5px;border-bottom:1px dashed var(--line)}
  .comp-line b{color:var(--comp);font-weight:600}
  .none{font-size:12px;color:var(--text3);padding:10px 2px 8px}

  .evt{display:flex;gap:11px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--line)}
  .evt:last-child{border-bottom:none}
  .tag{flex:none;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;margin-top:1px;letter-spacing:.5px;white-space:nowrap}
  .tag.open{background:var(--open-soft);color:var(--open)}
  .tag.close{background:var(--close-soft);color:var(--close)}
  .tag.change{background:var(--change-soft);color:var(--change)}
  .tag.act{background:var(--act-soft);color:var(--act)}
  .tag.comp{background:var(--comp-soft);color:var(--comp)}
  .evt .body{flex:1;min-width:0}
  .evt .t{font-size:13.5px;font-weight:600;line-height:1.4}
  .evt .t .where{color:var(--text3);font-weight:400;font-size:12.5px}
  .evt .note{font-size:12.5px;color:var(--text2);margin-top:1px}
  .evt .meta2{font-size:11.5px;color:var(--text3);margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
  .conf{font-weight:600}
  .conf.ok{color:var(--ok)}
  .conf.pending{color:var(--change)}
  .src{font-weight:600}

  .foot{margin-top:22px;padding-top:13px;border-top:1px solid var(--line);font-size:11px;color:var(--text3);
        display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo">闽</div>
      <div><h1>闽浙吾悦商圈动态监控</h1><div class="sub">12 家吾悦广场 · 分广场总览 / 竞品动态</div></div>
    </div>
    <div class="meta">数据更新：<b id="updatedAt">—</b><br>公开信源 AI 采集 · 需人工复核</div>
  </div>

  <div class="switch-row">
    <div class="seg">
      <button id="btnWy" class="active" onclick="switchView('wy')"><span class="dot" style="background:#e5484d"></span>吾悦动态</button>
      <button id="btnComp" onclick="switchView('comp')"><span class="dot" style="background:#7c5bff"></span>竞品动态</button>
    </div>
  </div>

  <div class="statstrip" id="stats"></div>
  <div class="filters" id="filters"></div>

  <div id="feed"></div>

  <div class="foot">
    <span>闽浙吾悦商圈监控平台 · 内部使用</span>
    <span>信源：商场公众号 / 本地新闻 / 行业媒体 / 政府公开信息 · 链接可点击核对</span>
  </div>
</div>

<script src="config.js"></script>
<script>document.write('<script src="data.js?v=' + Date.now() + '"><\/script>');</script>
<script>
const MALLS = window.MALLS || [];
const COMPS = window.COMPETITORS || {};
const DATA = window.DATA || {};

const TYPES = {
  wy:  [{key:"all",label:"全部"},{key:"open",label:"开店"},{key:"close",label:"闭店"},{key:"change",label:"调整"},{key:"activity",label:"活动"}]
};

let view="wy", mallFilter="all", typeFilter="all";
const DATES=Object.keys(DATA).sort().reverse();

const mallName=id=>{const m=MALLS.find(x=>x.id===id);return m?m.name:(id||"")};

/* 事件归属日期（今天/昨天/前天，或 MM-DD） */
function dateOf(e){
  const d=DATES.find(x=>(DATA[x]||[]).includes(e));
  if(!d)return "";
  const idx=DATES.indexOf(d);
  return ["今天","昨天","前天"][idx] || d.slice(5);
}

/* 新鲜度过滤：when 留空(进行中) / 未来 / 近14天内 才显示，过期自动隐藏 */
function isFresh(e){
  if(!e.when) return true;
  const today=new Date(DATES[0]+"T00:00:00");
  const w=new Date(e.when+"T00:00:00");
  return (today.getTime()-w.getTime()) <= 14*86400000;
}

/* 来源链接：有原文则渲染可点击 <a>，否则仅来源名 */
function srcLink(source, url){
  const name = source || "未知来源";
  if(url && url!=="#" && url!=="") return `<a class="src" href="${url}" target="_blank" rel="noopener">${name} ↗</a>`;
  return `<span class="src">${name}</span>`;
}

function tagOf(e){
  if(e.type==="open")return '<span class="tag open">开店</span>';
  if(e.type==="close")return '<span class="tag close">闭店</span>';
  if(e.type==="change")return '<span class="tag change">调整</span>';
  if(e.type==="activity")return '<span class="tag act">活动</span>';
  return '<span class="tag comp">竞品</span>';
}
function compTag(e){
  const map={open:['竞品·新店','open'],close:['竞品·闭店','close'],change:['竞品·调改','change'],event:['竞品·活动','act'],risk:['竞品·风险','open']};
  const [label,cls]=map[e.subtype]||['竞品','comp'];
  return `<span class="tag ${cls}">${label}</span>`;
}

function switchView(v){
  view=v; typeFilter="all"; mallFilter="all";
  document.getElementById("btnWy").classList.toggle("active",v==="wy");
  document.getElementById("btnComp").classList.toggle("active",v==="comp");
  render();
}

function stats(){
  if(view==="wy"){
    const L=DATES.flatMap(d=>(DATA[d]||[]).filter(e=>["open","close","change","activity"].includes(e.type)&&isFresh(e)));
    const n=t=>L.filter(e=>e.type===t).length;
    const net=n("open")-n("close");
    return `<span class="pill">开店 <b>${n("open")}</b></span><span class="pill">闭店 <b>${n("close")}</b></span><span class="pill">调整 <b>${n("change")}</b></span><span class="pill">活动 <b>${n("activity")}</b></span><span class="pill">净 <b class="${net>=0?'up':'down'}">${net>=0?'+':''}${net}</b></span>`;
  }
  const total=Object.keys(COMPS).reduce((s,k)=>s+(COMPS[k]||[]).length,0);
  const ev=DATES.reduce((s,d)=>s+(DATA[d]||[]).filter(e=>e.type==="comp"&&isFresh(e)).length,0);
  return `<span class="pill">主要竞品商场 <b>${total}</b></span><span class="pill">竞品动态 <b>${ev}</b> 条</span>`;
}

function filters(){
  const el=document.getElementById("filters");
  if(view==="wy"){
    el.innerHTML=`<span class="lbl">类型</span>`+TYPES.wy.map(t=>`<button class="chip ${typeFilter===t.key?'active':''}" onclick="setType('${t.key}')">${t.label}</button>`).join("");
  }else{
    el.innerHTML=`<span class="lbl">选择广场</span><button class="chip ${mallFilter==='all'?'active':''}" onclick="setMall('all')">全部</button>`+
         MALLS.map(m=>`<button class="chip ${mallFilter===m.id?'active':''}" onclick="setMall('${m.id}')">${m.name.replace('吾悦广场','吾悦')}</button>`).join("");
  }
}
function setType(k){typeFilter=k;filters();feed();}
function setMall(k){mallFilter=k;filters();feed();}

/* 吾悦事件行 */
function wyEvtRow(e){
  const meta=[e.floor&&e.floor!=="—"?e.floor:null, e.category].filter(Boolean).join(" · ");
  return `<div class="evt">${tagOf(e)}
    <div class="body">
      <div class="t">${e.title}</div>
      <div class="note">${e.note||""}</div>
      <div class="meta2">${dateOf(e)}${meta?" · "+meta:""} · 来源·${srcLink(e.source,e.sourceUrl)} · <span class="conf ${e.confidence==='ok'?'ok':'pending'}">${e.confidence==='ok'?'已确认':'待核实'}</span></div>
    </div></div>`;
}

/* 竞品事件行 */
function compEvtRow(e){
  return `<div class="evt">${compTag(e)}
    <div class="body">
      <div class="t">${e.title} <span class="where">${e.brand}</span></div>
      <div class="note">${e.note||""}</div>
      <div class="meta2">${dateOf(e)} · 来源·${srcLink(e.source,e.sourceUrl)} · <span class="conf ${e.confidence==='ok'?'ok':'pending'}">${e.confidence==='ok'?'已确认':'待核实'}</span></div>
    </div></div>`;
}

/* 吾悦视图：分广场铺开 */
function wySections(){
  let html="";
  MALLS.forEach(m=>{
    const evts=DATES.flatMap(d=>(DATA[d]||[]).filter(e=>{
      if(!["open","close","change","activity"].includes(e.type))return false;
      if(e.mall!==m.id)return false;
      if(typeFilter!=="all"&&e.type!==typeFilter)return false;
      if(!isFresh(e))return false;
      return true;
    }));
    html+=`<div class="mall-section">
      <div class="mall-head">
        <div><span class="mname">${m.name}</span><span class="mcity">${m.city}·${m.prov}</span></div>
        <span class="mcount">${evts.length?evts.length+" 条动态":""}</span>
      </div>
      <div class="mall-body">${evts.length?evts.map(wyEvtRow).join(""):'<div class="none">暂无动态</div>'}</div>
    </div>`;
  });
  return html;
}

/* 竞品视图：分广场铺开 */
function compSections(){
  let html="";
  MALLS.filter(m=>mallFilter==="all"||m.id===mallFilter).forEach(m=>{
    const comps=COMPS[m.id]||[];
    const evts=DATES.flatMap(d=>(DATA[d]||[]).filter(e=>e.type==="comp"&&e.mall===m.id&&isFresh(e)));
    const compNames=comps.map(c=>c.name).join(" / ");
    let body="";
    if(compNames) body+=`<div class="comp-line">主要竞品：<b>${compNames}</b></div>`;
    if(evts.length) body+=evts.map(compEvtRow).join("");
    else body+=`<div class="none">${compNames?"暂无竞品动态":"暂无竞品信息"}</div>`;
    html+=`<div class="mall-section">
      <div class="mall-head">
        <div><span class="mname">${m.name}</span><span class="mcity">${m.city}·${m.prov}</span></div>
        <span class="mcount">${evts.length?evts.length+" 条竞品动态":""}</span>
      </div>
      <div class="mall-body">${body}</div>
    </div>`;
  });
  return html;
}

function feed(){
  document.getElementById("feed").innerHTML = view==="wy" ? wySections() : compSections();
}

function render(){
  document.getElementById("updatedAt").textContent=window.UPDATED_AT||"";
  document.getElementById("stats").innerHTML=stats();
  filters();
  feed();
}
render();
</script>
</body>
</html>
